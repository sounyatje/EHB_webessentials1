<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .container {
    display: flex;
    width: 600px;
    border: 2px solid black;
    margin-bottom: 20px;
  }
  .item {
    padding: 10px;
    border: 1px solid gray;
  }

  /* Tous grow = 1 (ratio 1:1:1) */
  .same .item {
    flex-grow: 1;
  }

  /* Ratios différents: 1, 2, 3 */
  .diff .item:nth-child(1) { flex-grow: 1; }
  .diff .item:nth-child(2) { flex-grow: 2; }
  .diff .item:nth-child(3) { flex-grow: 3; }
</style>
</head>
<body>
    <h2>flex-grow: 1, 1, 1</h2>
<div class="container same">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>

<h2>flex-grow: 1, 2, 3</h2>
<div class="container diff">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>
</body>
</html>

<!-- 1. Question 15 – flex-basis
Texte : “Wat is het effect van flex-basis op een flex‑item?”
Bonne réponse : “Het stelt de initiële grootte van een flex‑item in.” (ça règle la taille de base de l’item).

flex-basis = la taille de départ de l’item sur l’axe principal (largeur en row, hauteur en column).

Ensuite, flex-grow peut l’agrandir et flex-shrink peut la réduire, mais la base vient de flex-basis.

Donc ce n’est ni l’alignement, ni la direction, ni l’ordre, juste la taille de base.

2. Question 19 – flex: 0 1 auto
Code :

css
.container {
  display: flex;
}
.item {
  flex: 0 1 auto;
}
La propriété flex est un raccourci pour :

css
flex-grow: 0;
flex-shrink: 1;
flex-basis: auto;
C’est la valeur par défaut d’un flex‑item.

flex-grow: 0 → l’item ne grandit pas pour prendre l’espace libre.

flex-shrink: 1 → l’item peut rétrécir si manque de place.
​
​

flex-basis: auto → la taille de base vient du contenu ou de width/height.-->
